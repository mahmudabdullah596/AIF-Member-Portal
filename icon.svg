<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Letter Gradient -->
    <linearGradient id="whiteSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18" />

  <!-- Decorative Background Halo Circles -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Stylized AIF Monogram Emblem with Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Golden Islamic / Crescent Arch Flourish on Top -->
    <path d="M 216 115 C 235 105 277 105 296 115" fill="none" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round" />
    <circle cx="256" cy="98" r="7" fill="url(#goldGradient)" />

    <!-- AIF Letters Container -->
    <!-- Letter 'A' -->
    <path d="M 125 330 L 175 160 L 225 330" fill="none" stroke="url(#whiteSilverGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 148 275 L 202 275" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round" />

    <!-- Letter 'I' -->
    <path d="M 256 160 L 256 330" stroke="url(#whiteSilverGrad)" stroke-width="24" stroke-linecap="round" />
    <circle cx="256" cy="140" r="10" fill="url(#goldGradient)" />

    <!-- Letter 'F' -->
    <path d="M 295 160 L 295 330" stroke="url(#whiteSilverGrad)" stroke-width="24" stroke-linecap="round" />
    <path d="M 295 174 L 385 174" stroke="url(#whiteSilverGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 295 242 L 365 242" stroke="url(#goldGradient)" stroke-width="15" stroke-linecap="round" />
  </g>

  <!-- Bottom Accent / Growth Curve -->
  <g filter="url(#shadowFilter)">
    <path d="M 130 380 Q 256 425 382 380" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />
    <!-- Subtitle Badge 'AL-ITTEHAD' in clean minimal dots/stars -->
    <circle cx="256" cy="402" r="5" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="226" cy="399" r="3.5" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="286" cy="399" r="3.5" fill="#ffffff" fill-opacity="0.6" />
  </g>
</svg>
