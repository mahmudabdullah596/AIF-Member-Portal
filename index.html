    <script>
        // Suppress harmless Vite HMR WebSocket errors inside sandboxed preview iframe
        (function() {
            var origError = console.error;
            console.error = function() {
                for (var i = 0; i < arguments.length; i++) {
                    var str = (arguments[i] && (arguments[i].message || arguments[i].stack || String(arguments[i]))) || '';
                    if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
                        return;
                    }
                }
                return origError.apply(console, arguments);
            };

            window.addEventListener('error', function(event) {
                var msg = event.message || (event.error && (event.error.message || event.error.stack)) || '';
                if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('wss:') !== -1) {
                    event.stopImmediatePropagation();
                    event.preventDefault();
                    return true;
                }
            }, true);

            window.addEventListener('unhandledrejection', function(event) {
                var reason = (event.reason && (event.reason.message || String(event.reason))) || '';
                if (reason.indexOf('WebSocket') !== -1) {
                    event.stopImmediatePropagation();
                    event.preventDefault();
                }
            }, true);
        })();
    </script>
