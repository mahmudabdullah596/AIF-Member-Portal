    <script>
        // Suppress harmless Vite HMR WebSocket connection errors inside sandboxed iframe
        window.addEventListener('error', function(event) {
            if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('ws:') !== -1 || event.message.indexOf('wss:') !== -1)) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return true;
            }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
                event.stopImmediatePropagation();
                event.preventDefault();
            }
        }, true);
    </script>
